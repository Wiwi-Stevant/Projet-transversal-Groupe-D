services:
  db:
    image: postgres:15-alpine
    container_name: edf_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edf}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - edf_postgres_data:/var/lib/postgresql/data
      # Initialise le schéma au 1er démarrage (si volume vide)
      - ./edf/db.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  edf_postgres_data:
