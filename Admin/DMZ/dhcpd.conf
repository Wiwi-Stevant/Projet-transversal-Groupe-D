# Exemple de dhcpd.conf pour une DMZ sécurisée
subnet 192.168.100.0 netmask 255.255.255.0 {
  # Pas de 'range' dynamique = pas d'inconnu dans la zone
  
  # Réservation pour ton serveur API ou autre
  host serveur_api {
    hardware ethernet 00:11:22:33:44:55;
    fixed-address 192.168.100.10;
  }
}