services:
  web:
    build: ./Projet-transversal-Groupe-D/edf/client/
    container_name: web
    networks:
      - dmz

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    ports:
      - "1883:1883"
    restart: always
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - dmz

  api:
    build: ./Projet-transversal-Groupe-D/edf/server/
    container_name: api
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: always
    networks:
      - dmz
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: postgres_lan
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Gougougagaklemdpdefoula
      POSTGRES_DB: EdfDb
    volumes:
      - Dbdata:/var/lib/postgresql/data
    networks:
      - dmz

  mopi:
    image: nginx:alpine
    container_name: mopi
    ports:
      - "80:80"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - dmz
    depends_on:
      - api

networks:
  dmz:

volumes:
  Dbdata:
