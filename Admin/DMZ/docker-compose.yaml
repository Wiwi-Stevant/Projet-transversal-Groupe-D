version: "3.9"

services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: always
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - webReverseProx
      - filebeatDMZ

  web:
    image: nginx:1.27-alpine
    container_name: nginx_web
    restart: always
    volumes:
      - ./web/www:/usr/share/nginx/html
      - ./web/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - webReverseProx
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`site.mondomaine.com`)"
      - "traefik.http.routers.web.entrypoints=web"

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    container_name: filebeat_dmz
    user: root
    restart: always
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml
    networks:
      - filebeatDMZ
    depends_on:
      - traefik
      - web

  ntp_relay:
    image: cturra/ntp
    container_name: ntp_relay_dmz
    restart: always
    network_mode: host
    environment:
      - NTP_SERVERS=<IP_NTP_LAN>
  dhcp:
    image: networkboot/dhcpd
    container_name: dhcp_server
    network_mode: "host" # Indispensable pour capter les requêtes DHCP
    volumes:
      - ./dhcpd.conf:/data/dhcpd.conf
    restart: always

networks:
  webReverseProx:
  filebeatDMZ:
