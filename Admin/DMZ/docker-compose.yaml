version: "3.9"

services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: always
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"   # Dashboard interne (à restreindre)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - apiReverseProx
      - webReverseProx
      - filebeatDMZ

  web:
    image: nginx:1.27-alpine
    container_name: nginx_web
    restart: always
    volumes:
      - ./web/www:/usr/share/nginx/html
      - ./web/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - webReverseProx
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`site.mondomaine.com`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls=true"

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    container_name: filebeat_dmz
    user: root
    restart: always
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml
    networks:
      - filebeatDMZ
    depends_on:
      - traefik
      - web

  # NTP Relay (UNIQUEMENT si DMZ ne peut pas joindre le LAN en UDP 123)
  ntp_relay:
    image: cturra/ntp
    container_name: ntp_relay_dmz
    restart: always
    network_mode: host   # NTP = UDP 123 → host mode obligatoire
    environment:
      - NTP_SERVERS=<IP_NTP_LAN>
    # À activer seulement si nécessaire
    # networks:
    #   - dmzNtp

networks:
  apiReverseProx:
  webReverseProx:
  filebeatDMZ:
  # dmzNtp:   # seulement si tu actives le relay
