name: CD - Frontend SSH Deploy

on:
  push:
    branches:
      - CI/CD
      - main
    paths:
      - "edf/client/**"
      - "edf/.github/workflows/cd-frontend.yml"
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edf/client
    concurrency:
      group: frontend-deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edf/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_URL: http://${{ secrets.SERVER_IP }}:3000/api
        run: |
          npm run build

      - name: Deploy to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 56420
          source: "edf/client/dist/*"
          target: "/var/www/html/"
          strip_components: 3

      - name: Reload web server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 56420
          script: |
            sudo systemctl reload nginx || sudo service nginx reload || true

